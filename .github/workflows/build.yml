name: Build

on:
  # 每次推送 master / main 都重新打包，并按「当天日期」发布 Release；
  # 同一天重复构建会删掉当天旧 Release，用本次产物整体替换
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# 连续推送时只保留最新一次，避免两个运行同时改同一个 Release
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要连累其它平台出包
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows
          - os: macos-latest
            platform: mac
            artifact: macos
          - os: ubuntu-latest
            platform: linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 版本号 = 北京时间当天日期（20261106），让安装包文件名和 Release tag 对齐
      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(TZ=Asia/Shanghai date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      # 架构矩阵（x64 / arm64）在 electron-builder.yml 里，这里不额外传。
      # --publish never：产物由下面的 release 作业统一发布，
      # 避免三个平台同时抢着建同一个 Release。
      # --config.extraMetadata.version 覆盖 package.json 版本号，
      # 产物文件名里的版本不再是 0.1.0，而是当天日期。
      - name: Build and package
        shell: bash
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform }} --publish never \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz

  release:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 版本号 = 北京时间当天日期（20261106），同时生成构建时间与提交号
      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=$(TZ=Asia/Shanghai date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "built_at=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (UTC+8)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          cat > notes.md <<EOF
          ## Sakura Music 自动构建

          - **版本号**: ${{ steps.version.outputs.version }}
          - **构建时间**: ${{ steps.version.outputs.built_at }}
          - **Commit**: ${{ steps.version.outputs.commit }}
          EOF
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${GITHUB_REPOSITORY}"
          REF="repos/${REPO}/git/ref/tags/${VERSION}"

          # 同一天再构建：把当天旧 Release 连同日期 tag 整个删掉，用本次产物重建。
          # 只在旧 Release 上 upload --clobber 只覆盖同名文件：旧包会残留，
          # 构建时间 / commit 说明也不会跟着更新。
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$VERSION" --repo "$REPO" --yes --cleanup-tag
          elif gh api "$REF" >/dev/null 2>&1; then
            # Release 已不在、但同名 tag 还在：也删掉，免得新 Release 挂到旧提交。
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${VERSION}"
          fi

          # tag 删除偶有 API 延迟，等它真的消失再 create，否则会复用旧 tag、
          # 把这次的产物挂到上一次的提交上。
          for _ in $(seq 1 10); do
            gh api "$REF" >/dev/null 2>&1 || break
            sleep 2
          done
          if gh api "$REF" >/dev/null 2>&1; then
            echo "::error::日期 tag ${VERSION} 仍在，终止发布以免关联到旧提交"
            exit 1
          fi

          gh release create "$VERSION" artifacts/* \
            --repo "$REPO" \
            --target "${GITHUB_SHA}" \
            --title "Release ${VERSION}" \
            --notes-file notes.md
