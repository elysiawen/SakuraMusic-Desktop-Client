<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="deep">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP 跟着 HTML 走：dev 由 Vite 提供、release 由 sakura:// 协议提供，是同一份文件、
      同一套策略，不再依赖某一侧服务器注入响应头。frame-ancestors 只对 header 有效，
      已省略（Electron 窗口本来也不允许被嵌套）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Sakura Music</title>
    <style>
      /*
       * 启动加载层：随 HTML 第一帧就渲染，不依赖 JS bundle。
       * 窗口 ready-to-show 时页面已可绘制，但 router.beforeEach 还在等
       * /api/auth/me，RouterView 是空的 —— 没这层就是一片白屏。
       * 样式自包含（外部 CSS 要等 bundle 到位）。
       */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f7fa;
        color: #2f3440;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        transition: opacity 0.2s ease;
      }
      html[data-boot-hidden] #boot-splash { display: none; }
      html[data-boot-dark] #boot-splash { background: #14161c; color: #e9ecf3; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }

      /* logo 与名称排一行，跟侧边栏的品牌行同一个观感。 */
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      /* 品牌标识与侧边栏、安装包、任务栏用的是同一份 build/icon.png。 */
      .boot-logo {
        width: 48px;
        height: 48px;
        /* 图标是白底方图，裁成圆角，深色加载层上才不会是一块白方片。 */
        border-radius: 12px;
        filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.16));
        -webkit-user-drag: none;
        user-select: none;
      }
      .boot-title { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; }
      .boot-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(127, 137, 160, 0.28);
        border-top-color: var(--boot-accent, #5b8cff);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-hint { font-size: 12px; opacity: 0.66; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 2s; }
      }
    </style>
    <!-- 外置：CSP 是 script-src 'self'，内联脚本在生产包里会被拦掉（见 boot.js）。 -->
    <script src="./boot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-brand">
        <img class="boot-logo" src="./icon.png" alt="" draggable="false" />
        <span class="boot-title">Sakura Music</span>
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-hint" id="boot-hint">正在连接音乐服务…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
