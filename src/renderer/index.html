<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="deep">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Sakura Music</title>
    <style>
      /*
       * 启动加载层：随 HTML 第一帧就渲染，不依赖 JS bundle。
       * 窗口 ready-to-show 时页面已可绘制，但 router.beforeEach 还在等
       * /api/auth/me，RouterView 是空的 —— 没这层就是一片白屏。
       * 样式自包含（外部 CSS 要等 bundle 到位）。
       */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f7fa;
        color: #2f3440;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        transition: opacity 0.2s ease;
      }
      html[data-boot-hidden] #boot-splash { display: none; }
      html[data-boot-dark] #boot-splash { background: #14161c; color: #e9ecf3; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }

      /* logo 与名称排一行，跟侧边栏的品牌行同一个观感。 */
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      /* 品牌标识与侧边栏、安装包、任务栏用的是同一份 build/icon.png。 */
      .boot-logo {
        width: 48px;
        height: 48px;
        /* 图标是白底方图，裁成圆角，深色加载层上才不会是一块白方片。 */
        border-radius: 12px;
        filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.16));
        -webkit-user-drag: none;
        user-select: none;
      }
      .boot-title { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; }
      .boot-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(127, 137, 160, 0.28);
        border-top-color: var(--boot-accent, #5b8cff);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-hint { font-size: 12px; opacity: 0.66; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 2s; }
      }
    </style>
    <script>
      (function () {
        // 副窗口（桌面歌词 / 弹出播放页）不显示加载层。
        if (new URLSearchParams(location.search).get('window')) {
          document.documentElement.setAttribute('data-boot-hidden', '1');
        }
        try {
          var t = JSON.parse(localStorage.getItem('sakura.desktop.theme') || '{}');
          var dark = t.mode === 'dark' ||
            (t.mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-boot-dark', '1');
          var accents = {
            sakura: '#ff7aa2', matcha: '#6fc47a', deep: '#5b8cff',
            wisteria: '#a78bfa', sunset: '#ff9a62', ink: '#9aa7bd'
          };
          document.documentElement.style.setProperty('--boot-accent', accents[t.palette] || '#5b8cff');
        } catch (e) {
          /* 存储不可用就用默认配色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-brand">
        <img class="boot-logo" src="./icon.png" alt="" draggable="false" />
        <span class="boot-title">Sakura Music</span>
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-hint" id="boot-hint">正在连接音乐服务…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
