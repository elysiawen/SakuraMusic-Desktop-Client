appId: com.sakura.music.desktop
productName: Sakura Music
copyright: Copyright © 2026 Sakura Music

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
compression: normal

win:
  icon: build/icon.png
  artifactName: ${productName} ${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
    # 绿色版：解压即用，和 Linux 的 tar.gz 对应
    - target: zip
      arch: [x64, arm64]

nsis:
  artifactName: ${productName} Setup ${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: build/icon.png
  category: public.app-category.music
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Audio
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  maintainer: Sakura Music
