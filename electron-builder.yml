appId: com.sakura.music.desktop
productName: Sakura Music
copyright: Copyright © 2026 Sakura Music

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
compression: normal

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: Sakura Music
